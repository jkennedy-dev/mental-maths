name: Linting & Formatting

on: [push]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          version: "0.15.6"

      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          version: "0.15.6"
