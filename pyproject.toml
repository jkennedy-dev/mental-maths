[project]
name = "mental-maths"
version = "0.2.0"
description = "a simple mental maths terminal UI"
requires-python = ">=3.13"
dependencies = [
    "pyaudio>=0.2.14",
    "vosk>=0.3.45",
]

[project.scripts]
mental-maths = "mentalmaths.__main__:run"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["mentalmaths"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
